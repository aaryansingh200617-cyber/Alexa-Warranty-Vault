services:
  - type: web
    name: warranty-vault-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: MCP_HOST
        value: 127.0.0.1
      - key: MCP_PORT
        value: 8765
      - key: MCP_URL
        value: http://127.0.0.1:8765/mcp
